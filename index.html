<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Tap the Muradi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
        }

        #game {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;

            background-image: url("background.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            touch-action: manipulation;
        }

        #title {
            position: absolute;
            top: 18px;
            width: 100%;
            text-align: center;

            color: white;
            font-size: 32px;
            font-weight: bold;

            text-shadow: 3px 3px 5px #333;

            pointer-events: none;
            z-index: 10;
        }

        #score {
            position: absolute;
            top: 68px;
            left: 20px;

            color: white;
            font-size: 25px;
            font-weight: bold;

            text-shadow: 2px 2px 4px #333;

            pointer-events: none;
            z-index: 10;
        }

        #timer {
            position: absolute;
            top: 68px;
            right: 20px;

            color: white;
            font-size: 25px;
            font-weight: bold;

            text-shadow: 2px 2px 4px #333;

            pointer-events: none;
            z-index: 10;
        }

        #person {
            position: absolute;

            width: 120px;
            height: 120px;

            object-fit: cover;
            border-radius: 50%;

            cursor: pointer;
            user-select: none;
            -webkit-user-drag: none;

            touch-action: manipulation;

            z-index: 5;

            transition:
                width 0.15s,
                height 0.15s,
                left 0.1s,
                top 0.1s;
        }

        #startScreen,
        #gameOverScreen {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            background: rgba(0, 0, 0, 0.25);

            z-index: 20;
        }

        #gameOverScreen {
            display: none;
        }

        .message {
            color: white;
            font-size: 42px;
            font-weight: bold;

            text-shadow: 3px 3px 5px #333;

            margin-bottom: 20px;

            text-align: center;
        }

        #finalScore {
            color: white;
            font-size: 28px;
            font-weight: bold;

            text-shadow: 2px 2px 4px #333;

            margin-bottom: 20px;
        }

        button {
            border: none;

            padding: 15px 30px;

            border-radius: 15px;

            font-size: 22px;
            font-weight: bold;

            background: #ffcc00;
            color: #333;

            cursor: pointer;

            box-shadow: 0 5px 0 #c49c00;

            touch-action: manipulation;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #c49c00;
        }

        #hint {
            color: white;
            font-size: 18px;

            margin-top: 18px;

            text-shadow: 2px 2px 3px #333;

            text-align: center;
        }
    </style>
</head>

<body>

<div id="game">

    <!-- GAME NAME -->

    <div id="title">
        TAP THE MURADI TO GET POINTS
    </div>


    <!-- SCORE -->

    <div id="score">
        Score: 0
    </div>


    <!-- TIMER -->

    <div id="timer">
        Time: 30
    </div>


    <!-- PERSON -->

    <img
        id="person"
        src="person.jpg"
        alt="Muradi"
    >


    <!-- START SCREEN -->

    <div id="startScreen">

        <div class="message">
            TAP THE MURADI TO GET POINTS
        </div>

        <button id="startButton">
            START
        </button>

        <div id="hint">
            Tap the Muradi as many times as you can!
        </div>

    </div>


    <!-- GAME OVER SCREEN -->

    <div id="gameOverScreen">

        <div class="message">
            GAME OVER
        </div>

        <div id="finalScore">
            Score: 0
        </div>

        <button id="restartButton">
            PLAY AGAIN
        </button>

    </div>

</div>


<script>

    // =================================
    // GET GAME ELEMENTS
    // =================================

    const game =
        document.getElementById("game");

    const person =
        document.getElementById("person");

    const scoreDisplay =
        document.getElementById("score");

    const timerDisplay =
        document.getElementById("timer");

    const startScreen =
        document.getElementById("startScreen");

    const gameOverScreen =
        document.getElementById("gameOverScreen");

    const startButton =
        document.getElementById("startButton");

    const restartButton =
        document.getElementById("restartButton");

    const finalScore =
        document.getElementById("finalScore");


    // =================================
    // SAME SOUND FOR TAP + GAME OVER
    // =================================

    const sound =
        new Audio("gameover.mp3");

    sound.preload = "auto";


    // =================================
    // PLAY SOUND
    // =================================

    function playSound() {

        sound.pause();

        sound.currentTime = 0;

        sound.play().catch(function(error) {

            console.log(
                "Sound could not play:",
                error
            );

        });

    }


    // =================================
    // GAME VARIABLES
    // =================================

    let score = 0;

    let timeLeft = 30;

    let gameRunning = false;

    let timerInterval = null;

    let personSize = 120;


    // =================================
    // MOVE PERSON
    // =================================

    function movePerson() {

        const maxX =
            game.clientWidth -
            personSize;

        const maxY =
            game.clientHeight -
            personSize;

        const x =
            Math.random() *
            Math.max(0, maxX);

        const y =
            Math.random() *
            Math.max(0, maxY);

        person.style.left =
            x + "px";

        person.style.top =
            y + "px";

        person.style.transform =
            "none";
    }


    // =================================
    // START GAME
    // =================================

    function startGame() {

        clearInterval(timerInterval);

        score = 0;

        timeLeft = 30;

        personSize = 120;

        gameRunning = true;


        scoreDisplay.textContent =
            "Score: 0";

        timerDisplay.textContent =
            "Time: 30";


        person.style.width =
            "120px";

        person.style.height =
            "120px";


        startScreen.style.display =
            "none";

        gameOverScreen.style.display =
            "none";


        movePerson();


        // START TIMER

        timerInterval =
            setInterval(function() {

                timeLeft--;

                timerDisplay.textContent =
                    "Time: " + timeLeft;


                if (timeLeft <= 0) {

                    endGame();

                }

            }, 1000);
    }


    // =================================
    // TAP PERSON
    // =================================

    person.addEventListener(
        "pointerdown",
        function(event) {

            event.preventDefault();


            if (!gameRunning) {
                return;
            }


            // PLAY GAMEOVER.MP3

            playSound();


            // ADD SCORE

            score++;

            scoreDisplay.textContent =
                "Score: " + score;


            // MAKE PERSON SMALLER

            if (score % 5 === 0) {

                personSize =
                    Math.max(
                        60,
                        personSize - 5
                    );

                person.style.width =
                    personSize + "px";

                person.style.height =
                    personSize + "px";
            }


            // MOVE PERSON

            movePerson();

        }
    );


    // =================================
    // GAME OVER
    // =================================

    function endGame() {

        if (!gameRunning) {
            return;
        }


        gameRunning = false;


        clearInterval(timerInterval);

        timerInterval = null;


        timerDisplay.textContent =
            "Time: 0";


        finalScore.textContent =
            "Score: " + score;


        // PLAY GAMEOVER.MP3

        playSound();


        // SHOW GAME OVER SCREEN

        gameOverScreen.style.display =
            "flex";
    }


    // =================================
    // START BUTTON
    // =================================

    startButton.addEventListener(
        "click",
        function() {

            startGame();

        }
    );


    // =================================
    // PLAY AGAIN BUTTON
    // =================================

    restartButton.addEventListener(
        "click",
        function() {

            startGame();

        }
    );


    // =================================
    // INITIAL POSITION
    // =================================

    person.style.left =
        "50%";

    person.style.top =
        "50%";

    person.style.transform =
        "translate(-50%, -50%)";

</script>

</body>
</html>
